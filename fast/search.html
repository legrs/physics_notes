<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Search Results</title>
  <script>
    const q = new URLSearchParams(location.search).get('q');
    const dest = '../search.html?mode=fast' + (q ? '&q=' + encodeURIComponent(q) : '');
    location.replace(dest);
  </script>
</head>

<body></body>

</html>
