<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>Media Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ══════════════════════════════════════════════════════════════
       テーマ（qa_editor.html と同じトークン。ダーク／ライト自動追従）
    ══════════════════════════════════════════════════════════════ */
    :root {
      --accent: #3b82f6;
      --accent-fg: #ffffff;
      --accent-soft: rgba(59, 130, 246, 0.08);
      --bg: #ffffff;
      --bg-surface: #fafafa;
      --bg-elevated: #f5f5f5;
      --bg-card: #ffffff;
      --text-primary: #111111;
      --text-body: #222222;
      --text-secondary: #444444;
      --text-muted: #888888;
      --border: #eeeeee;
      --border-mid: #e0e0e0;
      --border-dark: #dddddd;
      --input-bg: #ffffff;
      --code-bg: #f3f4f6;
      --code-border: #e5e7eb;
      --ok: #16a34a;
      --error: #dc2626;
      --diff: #b45309;
      --checker-a: #e9e9ee;
      --checker-b: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent-soft: rgba(59, 130, 246, 0.18);
        --bg: #000000;
        --bg-surface: #0d0d0d;
        --bg-elevated: #1a1a1a;
        --bg-card: #0a0a0a;
        --text-primary: #f2f2f2;
        --text-body: #dddddd;
        --text-secondary: #aaaaaa;
        --text-muted: #777777;
        --border: #222222;
        --border-mid: #2a2a2a;
        --border-dark: #333333;
        --input-bg: #111111;
        --code-bg: #14141a;
        --code-border: #2a2a2a;
        --ok: #4ade80;
        --error: #f87171;
        --diff: #fbbf24;
        --checker-a: #2a2a30;
        --checker-b: #1a1a1f;
      }

      body {
        color-scheme: dark;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior-y: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
      background: var(--bg);
      color: var(--text-body);
      font-size: 14px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ── Topbar ── */
    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    #topbar h1 {
      font-size: 16px;
      margin: 0;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .topbar-sub {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .topbar-links a {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      margin-right: 10px;
      white-space: nowrap;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .status {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 40vw;
    }

    .status.ok {
      color: var(--ok);
    }

    .status.error {
      color: var(--error);
    }

    .status.loading {
      color: var(--accent);
    }

    .btn {
      border: 1px solid var(--border-dark);
      background: var(--bg-card);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      background: var(--bg-elevated);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent);
      filter: brightness(1.08);
    }

    .btn-danger {
      color: var(--error);
    }

    .btn-small {
      padding: 3px 8px;
      font-size: 12px;
    }

    .btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .mobile-tabbar {
      display: none;
    }

    .source-bar {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      line-height: 1.5;
    }

    .source-bar .src-pill {
      border-radius: 999px;
      padding: 1px 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-mid);
      font-weight: 600;
    }

    .source-bar .src-pill.local {
      border-color: var(--ok);
      color: var(--ok);
    }

    .drop-active .sidebar {
      outline: 3px dashed var(--accent);
      outline-offset: -6px;
    }

    .snippet {
      display: flex;
      gap: 6px;
      align-items: center;
      margin: 4px 0;
    }

    .snippet code {
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      white-space: nowrap;
      font-size: 12px;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: 4px 8px;
    }

    .import-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .import-item .name {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
      color: var(--text-primary);
      word-break: break-all;
    }

    ol.steps {
      padding-left: 20px;
      margin: 6px 0 12px;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    /* ── Layout: sidebar | preview | panel ── */
    #layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 360px;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--bg-surface);
    }

    .right-panel {
      border-left: 1px solid var(--border);
      background: var(--bg-card);
    }

    .scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* ── Sidebar ── */
    .sidebar-head {
      padding: 10px 10px 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .search-row {
      display: flex;
      gap: 6px;
    }

    .field-input {
      width: 100%;
      border: 1px solid var(--border-dark);
      background: var(--input-bg);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
    }

    .field-input:focus {
      border-color: var(--accent);
    }

    .field-input.invalid {
      border-color: var(--error);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chip {
      border: 1px solid var(--border-dark);
      background: var(--bg-card);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    .chip .n {
      opacity: 0.7;
      margin-left: 3px;
    }

    .sidebar-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .media-list {
      padding: 6px 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .media-list.grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }

    .media-item {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 6px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      position: relative;
      background: transparent;
      text-align: left;
      width: 100%;
    }

    .media-item:hover {
      background: var(--bg-elevated);
    }

    .media-item.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .media-item.checked {
      border-color: var(--accent);
      border-style: dashed;
    }

    .media-list.grid .media-item {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }

    .thumb {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: var(--text-muted);
      background-color: var(--checker-b);
      background-image:
        linear-gradient(45deg, var(--checker-a) 25%, transparent 25%),
        linear-gradient(-45deg, var(--checker-a) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--checker-a) 75%),
        linear-gradient(-45deg, transparent 75%, var(--checker-a) 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    }

    .media-list.grid .thumb {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
    }

    .thumb img,
    .thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb.special {
      background: var(--bg-elevated);
    }

    .item-text {
      min-width: 0;
      flex: 1;
    }

    .item-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 3px;
    }

    .badge {
      font-size: 10px;
      line-height: 1.5;
      padding: 0 6px;
      border-radius: 999px;
      border: 1px solid var(--border-dark);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .badge.warn {
      border-color: var(--diff);
      color: var(--diff);
    }

    .badge.err {
      border-color: var(--error);
      color: var(--error);
    }

    .badge.info {
      border-color: var(--accent);
      color: var(--accent);
    }

    .badge.changed {
      background: var(--diff);
      border-color: var(--diff);
      color: #fff;
    }

    .item-check {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      display: none;
    }

    .selecting .item-check {
      display: block;
    }

    .selecting .media-list:not(.grid) .media-item {
      padding-left: 30px;
    }

    .empty-hint {
      color: var(--text-muted);
      font-size: 13px;
      padding: 16px;
      line-height: 1.6;
    }

    /* ── Preview ── */
    .preview-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .toolbar-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .toolbar-sep {
      flex: 1;
    }

    .toolbar-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-right: 2px;
    }

    .stage {
      flex: 1;
      min-height: 220px;
      overflow: auto;
      overscroll-behavior: contain;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .stage.bg-checker {
      background-color: var(--checker-b);
      background-image:
        linear-gradient(45deg, var(--checker-a) 25%, transparent 25%),
        linear-gradient(-45deg, var(--checker-a) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--checker-a) 75%),
        linear-gradient(-45deg, transparent 75%, var(--checker-a) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    .stage.bg-white {
      background: #ffffff;
    }

    .stage.bg-black {
      background: #0a0a0a;
    }

    .stage img,
    .stage video {
      display: block;
    }

    .stage.fit img,
    .stage.fit video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .stage.fit {
      align-items: center;
    }

    .stage:not(.fit) {
      align-items: flex-start;
      justify-content: flex-start;
    }

    .stage .stage-msg {
      color: var(--text-muted);
      text-align: center;
      line-height: 1.7;
      max-width: 460px;
      background: var(--bg-card);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .preview-info {
      border-top: 1px solid var(--border);
      max-height: 42%;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 10px 14px 14px;
      flex-shrink: 0;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 6px 14px;
      margin-bottom: 10px;
    }

    .info-cell .k {
      font-size: 11px;
      color: var(--text-muted);
    }

    .info-cell .v {
      font-size: 13px;
      color: var(--text-primary);
      word-break: break-all;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      margin: 10px 0 6px;
    }

    .uses {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .uses li {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      background: var(--bg-surface);
    }

    .uses .q {
      color: var(--text-primary);
      font-weight: 600;
    }

    .uses .meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .uses a {
      color: var(--accent);
      text-decoration: none;
    }

    /* ── Right panel ── */
    .panel-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .panel-tab {
      flex: 1;
      border: none;
      background: none;
      padding: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
    }

    .panel-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .panel-body {
      padding: 14px 16px 24px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .field-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    .field-hint.error {
      color: var(--error);
    }

    .source-box {
      font-size: 12px;
      line-height: 1.6;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      border: 1px solid var(--border-mid);
      background: var(--bg-surface);
      color: var(--text-secondary);
    }

    .source-box strong {
      color: var(--text-primary);
    }

    .caption-preview {
      border: 1px dashed var(--border-dark);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
      min-height: 34px;
    }

    .caption-preview a {
      color: inherit;
    }

    .caption-preview .none {
      font-style: italic;
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: -4px 0 12px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .note {
      font-size: 12px;
      line-height: 1.6;
      border-left: 3px solid var(--diff);
      padding: 6px 10px;
      margin: 12px 0;
      background: var(--bg-surface);
      color: var(--text-secondary);
    }

    .note.info {
      border-left-color: var(--accent);
    }

    .note ul {
      margin: 4px 0 0;
      padding-left: 18px;
    }

    .diff-list {
      list-style: none;
      padding: 0;
      margin: 0 0 12px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .diff-list li {
      padding: 2px 0;
      word-break: break-all;
    }

    .diff-add {
      color: var(--ok);
    }

    .diff-del {
      color: var(--error);
    }

    .diff-mod {
      color: var(--diff);
    }

    pre.code {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
      overflow: auto;
      overscroll-behavior: contain;
      max-height: 55vh;
      white-space: pre;
      margin: 0;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--text-primary);
      color: var(--bg);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 50;
    }

    .toast.show {
      opacity: 0.92;
    }

    /* ══════════════════════════════════════════════════════════════
       タブレット: 右パネルを細く
    ══════════════════════════════════════════════════════════════ */
    @media (max-width: 1180px) {
      #layout {
        grid-template-columns: 280px minmax(0, 1fr) 320px;
      }
    }

    /* ══════════════════════════════════════════════════════════════
       スマホ: 1ペインずつ。上部タブで 一覧 / 表示 / ライセンス / コード
    ══════════════════════════════════════════════════════════════ */
    @media (max-width: 900px) {

      .topbar-sub,
      .status,
      .btn-label,
      #folder-btn {
        display: none;
      }

      #topbar {
        padding: 8px 10px;
        gap: 6px;
      }

      #topbar h1 {
        font-size: 15px;
      }

      .topbar-links a {
        margin-right: 6px;
      }

      .topbar-links {
        display: flex;
        flex-direction: column;
        line-height: 1.3;
      }

      .topbar-right {
        gap: 5px;
      }

      .topbar-right .btn {
        padding: 6px 9px;
      }

      .mobile-tabbar {
        display: flex;
        border-bottom: 1px solid var(--border);
        background: var(--bg-card);
        flex-shrink: 0;
      }

      .mobile-tab-btn {
        flex: 1;
        padding: 11px 4px;
        border: none;
        background: none;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-muted);
        border-bottom: 2px solid transparent;
        position: relative;
      }

      .mobile-tab-btn.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }

      .mobile-tab-btn .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--diff);
        margin-left: 4px;
        vertical-align: middle;
      }

      #layout {
        display: block;
      }

      .pane {
        display: none;
        height: 100%;
      }

      #app[data-mview="list"] .sidebar,
      #app[data-mview="preview"] .preview-pane,
      #app[data-mview="license"] .right-panel,
      #app[data-mview="code"] .right-panel {
        display: flex;
      }

      .sidebar,
      .right-panel {
        border: none;
      }

      /* スマホでは右パネルの中のタブは上部タブに統合 */
      .panel-tabs {
        display: none;
      }

      .media-list.grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .preview-info {
        max-height: 50%;
      }

      .stage {
        padding: 12px;
      }

      .item-check {
        width: 22px;
        height: 22px;
      }

      .field-input {
        font-size: 16px; /* iOS のフォーカス時ズームを防ぐ */
      }
    }
  </style>
</head>

<body>
