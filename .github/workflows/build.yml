name: Build JSON

on:
  push:
    branches:
      - master
    paths:
      - 'q_and_a_data.json'
      - 'qa_images/**'
      - 'qa_images/licenses.json'
      - 'scripts/build.js'
      - 'scripts/normalize-images.js'
      - 'package.json'
  workflow_dispatch:

jobs:
  build:
    if: github.actor != 'physics-notes-bot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Get GitHub App user ID (for correct commit email)
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Ensure HuggingFace cache directory exists
        run: mkdir -p ~/.cache/huggingface/transformers-js

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/transformers-js
          key: hf-models-${{ runner.os }}-e5
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Install dependencies (sharp 0.35 prebuilt, no libvips-dev needed)
        run: |
          npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 || (sleep 10 && npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000) || (echo "::warning::npm ci failed, installing libvips-dev as fallback" && sudo apt-get update && sudo apt-get install -y libvips-dev && npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000)

      - name: Normalize qa_images filenames
        run: node scripts/normalize-images.js || { echo "::warning::normalize failed, skipping commit"; exit 0; }

      - name: Image stats
        run: |
          node -e "
          const fs=require('fs'),p=require('path'),MB=1024*1024,dir='qa_images';
          if(!fs.existsSync(dir)) { console.log('No qa_images dir'); process.exit(0); }
          const files=fs.readdirSync(dir).filter(f=>/\.(jpe?g|png|webp|svg|gif)$/i.test(f));
          let lt3=0,btw=0,gte5=0,total=0;
          files.forEach(f=>{const s=fs.statSync(p.join(dir,f)).size; total+=s; if(s<3*MB)lt3++; else if(s<5*MB)btw++; else gte5++; if(s>=5*MB) console.log('::warning::'+f+' is '+(s/MB).toFixed(1)+'MB (>=5MB)');});
          console.log('Images: '+files.length+' files, avg '+((total/(files.length||1))/MB).toFixed(2)+'MB, <3MB:'+lt3+' 3-5MB:'+btw+' >=5MB:'+gte5+', total '+(total/MB).toFixed(1)+'MB');
          "

      - name: Generate search_text and embeddings
        run: node scripts/build.js --embed

      - name: Generate dirlens.txt
        run: |
          OUTPUT=$(./node_modules/.bin/dirlens -G)
          printf '%s\n' "$OUTPUT" > dirlens.txt

      - name: Commit and push directly
        run: |
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git add qa_images q_and_a_data.json qa_images/licenses.json embeddings.json version.json dirlens.txt || true
          git diff --staged --quiet && echo "no changes" && exit 0
          STAGED=$(git diff --staged --name-only)
          # 写真関連（qa_images配下の実ファイル / licenses.json / answer内のqa_images参照）が含まれるかで分岐
          if echo "$STAGED" | grep -qE '^qa_images/'; then
            PHOTO=1
          elif git diff --staged -- q_and_a_data.json | grep -q "qa_images"; then
            PHOTO=1
          else
            PHOTO=0
          fi
          if [ "$PHOTO" = "1" ]; then
            git commit -m 'chore: normalize qa_images and regenerate embeddings'
          else
            git commit -m 'chore: auto-generate search_text and embeddings [skip ci]'
          fi
          git push || { git pull --rebase && git push; }
          