# physq（Physics Notes 検索 CLI）のリリースビルド。
#
# 自動トリガーは無し（GitHub Release はまだ運用開始していないため）。
# GitHub → Actions → このワークフロー → Run workflow のボタン操作でのみ実行する:
#   1. 5 ターゲットの release バイナリをビルド（各 OS のネイティブ runner。
#      Intel Mac は Microsoft 公式 ONNX Runtime 1.23.2 dylib に動的リンクする
#      semantic 対応ビルド（--no-default-features の BM25-only フォールバック
#      は physq update に触れない手動ビルド用に残してある）——下記コメント参照）
#   2. アーカイブ（tar.gz / zip）を作成
#   3. GitHub Release（draft）を作成し、タグ（physq-vX.Y.Z）とバイナリを添付
#      （タグを事前に push 済みならそれを使う。無ければこの実行時点の main に打つ）
#
# タグを physq-v* にしているのは、同一リポジトリの他リリース（将来の
# physics-notes 本体など）とタグ空間が衝突しないようにするため。
name: physq-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "確認用バージョン（例: 0.1.0）。physq/Cargo.toml の値と一致しないと失敗する。空欄なら確認をスキップ"
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest / macos-15 は現在 macOS 26 への移行期間中
          # （2026-06-15〜、あと約10日で完了予定）の混在イメージを引くことがあり、
          # そちらでは Xcode 26.5 の usr/lib/clang/ 以下が不完全で
          # `ld: library 'clang_rt.osx' not found` になることを確認した。
          # 専用の macos-26 イメージ（移行対象ではない）では Xcode 26.5 が
          # 正常に一式揃っており、回避策なしでビルドできることを実機確認済み。
          - target: aarch64-apple-darwin
            os: macos-26
            rustflags: ""
          # x86_64-apple-darwin（Intel Mac）: ort crate（ONNX Runtime
          # バインディング）が x86_64-apple-darwin 向けのプリビルド配布を
          # 一切持っておらず、"ort does not provide prebuilt binaries for the
          # target `x86_64-apple-darwin`" になる。また Microsoft も ONNX
          # Runtime 1.23.2 で x86_64 macOS の公式ビルドを終了した（1.24
          # 以降は存在しない）。そこで Intel は Microsoft 公式 1.23.2 の
          # dylib に動的リンクする:
          #   - physq/scripts/install_ort_intel.sh が D: の dylib を取得
          #     （SHA-256 固定）、ORT_LIB_LOCATION で ort-sys に指定
          #   - fastembed は 5.13.2（ort 2.0.0-rc.11・API 17）に固定 —
          #     5.14+ は ort に api-24 を要求し ORT 1.23 で初期化できない
          #     （physq/Cargo.toml のコメント参照）
          #   - RUSTFLAGS の -rpath,@loader_path で、同梱 dylib をバイナリと
          #     同じディレクトリから探す。リリースには physq と
          #     libonnxruntime.1.23.2.dylib を両方同梱して配布する
          #     （archives と physq-bin の隣に単体アセットも置く。
          #     update.rs の INTEL_ORT_DYLIB_ASSET とファイル名を一致させる）
          #   - ソースから ONNX Runtime をビルドすれば静的リンクも可能だが
          #     CI に 1〜2 時間かかるため見送り。
          - target: x86_64-apple-darwin
            os: macos-26-intel
            rustflags: "-C link-arg=-Wl,-rpath,@loader_path"
          #
          # ort がダウンロードするプリビルド ONNX Runtime は glibc >= 2.38
          # (__isoc23_strtol 等の ISO C23 版シンボルを要求) でビルドされており、
          # ubuntu-22.04 の glibc 2.35 ではリンクできない
          # ("ld.lld: error: undefined symbol: __isoc23_strtol" で確認済み)。
          # ubuntu-24.04 系 (glibc 2.39) に上げて解決する。結果として physq の
          # Linux バイナリは glibc >= 2.38 系のディストリ（Ubuntu 24.04+/
          # Debian 13+/Fedora 39+ 等）が実行時に必要（README に明記）。
          # lld への切り替え自体は必須ではないが、埋め込み IPADIC 辞書由来の
          # 巨大なオブジェクトを GNU ld より高速にリンクできるため維持する。
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            rustflags: "-C link-arg=-fuse-ld=lld"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            rustflags: "-C link-arg=-fuse-ld=lld"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            rustflags: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Gotcha: rust-cache's key doesn't account for the macOS Xcode/SDK in
      # use, only OS+arch+Cargo.lock. A build that only changes CI-side
      # toolchain selection (not Cargo.lock) can silently reuse a cached
      # link-step fingerprint pointing at a since-removed Xcode path,
      # failing with "ld: library 'clang_rt.osx' not found" for an SDK that
      # isn't even the one this job selected. Fixed structurally here:
      # scope the cache key per runner image AND per selected Xcode version,
      # so a build-script output produced on one image can never be replayed
      # on another.
      - name: Cache key — Xcode version
        if: runner.os == 'macOS'
        run: echo "XC_VERSION=$(xcodebuild -version 2>/dev/null | head -1 | awk '{print $2}')" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: physq
          prefix-key: "${{ matrix.os }}-${{ env.XC_VERSION }}"
      - name: Install lld (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld
      # Intel Mac links against the MS official ONNX Runtime 1.23.2 dylib —
      # see the matrix comment above and physq/scripts/install_ort_intel.sh.
      - name: Install ONNX Runtime (Intel Mac only)
        if: matrix.target == 'x86_64-apple-darwin'
        working-directory: physq
        run: |
          LIB_DIR="$(bash scripts/install_ort_intel.sh)"
          echo "ORT_LIB_LOCATION=$LIB_DIR" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
      - name: Build (release)
        working-directory: physq
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Collect
        run: |
          mkdir -p out/${{ matrix.target }}
          exe=physq; [[ "${{ matrix.target }}" == *windows* ]] && exe=physq.exe
          cp "physq/target/${{ matrix.target }}/release/$exe" "out/${{ matrix.target }}/"
          # Intel Mac のみ: 動的リンクした ONNX Runtime dylib をバイナリの隣に
          # 同梱する（RUSTFLAGS の -rpath,@loader_path で実行時にここから読み込む）
          if [[ "${{ matrix.target }}" == "x86_64-apple-darwin" ]]; then
            cp "$RUNNER_TEMP/onnxruntime/lib/libonnxruntime.1.23.2.dylib" "out/${{ matrix.target }}/"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: out/

  assemble:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create に必要(既定の GITHUB_TOKEN は read-only)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - name: Resolve version
        id: ver
        run: |
          v="$(grep -m1 '^version' physq/Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ -n "${{ github.event.inputs.version }}" ] && [ "${{ github.event.inputs.version }}" != "$v" ]; then
            echo "::error::physq/Cargo.toml の version ($v) と入力値 (${{ github.event.inputs.version }}) が一致しません。先に Cargo.toml を更新してください。"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Archive binaries for GitHub Release
        run: |
          # human-facing archives (physq-<version>-<triple>.{tar.gz,zip}) plus
          # unarchived per-target binaries (physq-bin-<triple>[.exe]) that
          # `physq update` fetches directly — no tar/zip decoding needed
          # client-side. checksums.txt covers only the latter (plus, for
          # Intel Mac, the bundled libonnxruntime.1.23.2.dylib).
          mkdir -p release
          for t in binaries/*/; do
            t="${t%/}"; triple="$(basename "$t")"
            name="physq-${{ steps.ver.outputs.version }}-$triple"
            if [ -f "$t/physq.exe" ]; then
              (cd "$t" && zip -q "../../release/$name.zip" physq.exe)
              cp "$t/physq.exe" "release/physq-bin-$triple.exe"
            else
              chmod +x "$t/physq"
              if [ -f "$t/libonnxruntime.1.23.2.dylib" ]; then
                # Intel Mac: dylib をアーカイブに同梱し、単体アセットとしても
                # 公開する（update.rs の INTEL_ORT_DYLIB_ASSET と一致させる）
                tar -czf "release/$name.tar.gz" -C "$t" physq libonnxruntime.1.23.2.dylib
                cp "$t/libonnxruntime.1.23.2.dylib" "release/libonnxruntime.1.23.2.dylib"
              else
                tar -czf "release/$name.tar.gz" -C "$t" physq
              fi
              cp "$t/physq" "release/physq-bin-$triple"
              chmod +x "release/physq-bin-$triple"
            fi
          done
          if ls release/libonnxruntime.*.dylib >/dev/null 2>&1; then
            (cd release && sha256sum physq-bin-* libonnxruntime.*.dylib > checksums.txt)
          else
            (cd release && sha256sum physq-bin-* > checksums.txt)
          fi
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # タグ physq-v${version} が既に push 済みならそれを使い、無ければこの実行時点の
          # コミットに新規作成する(gh release create の標準動作)。
          # version に "-" を含む場合（例: 0.1.2-rc1）は prerelease としてマークする。
          # physq update 自体は tag の semver を直接パースして stable/beta を判定するので
          # この --prerelease フラグには依存しないが、GitHub UI 上の表示を正しくするため。
          prerelease_flag=()
          [[ "${{ steps.ver.outputs.version }}" == *-* ]] && prerelease_flag=(--prerelease)
          gh release create "physq-v${{ steps.ver.outputs.version }}" --draft \
            --title "physq v${{ steps.ver.outputs.version }}" \
            "${prerelease_flag[@]}" \
            release/*
